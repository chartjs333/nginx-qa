<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<body><main><header><p class="eyebrow">nginx-qa · Managed Sprint</p><h1>Ваш спринт</h1></header>

<h2>Задания</h2><div id="assignments"></div><h2>Независимые review</h2><div id="reviews"></div>
