name: Path portability
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nginx_qa/paths.py'
      - 'nginx_qa/path-defaults.properties'
      - 'nginx_qa/sprint_types.py'
      - 'nginx_qa/managed_import.py'
      - 'nginx_qa/git_provider.py'
      - 'nginx_qa/workspace_manager.py'
      - 'nginx_qa/prompt_archive_migration.py'
      - 'main.py'
      - 'staging_host_app.py'
      - 'tests/test_path_portability.py'
      - 'tests/path-portability.txt'
      - '.github/workflows/path-portability.yml'
permissions:
  contents: read
jobs:
  paths:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt 'pytest>=8.2,<10' httpx
      - run: python -m pytest -q @tests/path-portability.txt --junitxml=path-results.xml
